    <!-- Polices : hébergées avec le site (Fontsource, voir src/main.tsx). -->

    <!-- Liens profonds GitHub Pages (spa-github-pages, MIT) : 404.html renvoie vers « /?/chemin&requête » ;
         on rétablit ici l'adresse propre avant le démarrage de l'application. -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>

    <!-- Theme initialization script (prevents flash of white) -->
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('tsa_theme') || 'dark';
          const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
