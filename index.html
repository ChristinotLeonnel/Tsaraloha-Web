    <!-- Theme initialization script (prevents flash of white) -->
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('tsa_theme') || 'dark';
          const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

  <body class="bg-slate-50 text-slate-900 dark:bg-tsa-navy-950 dark:text-slate-100 min-h-screen selection:bg-tsa-blue-600 selection:text-white transition-colors duration-200">
