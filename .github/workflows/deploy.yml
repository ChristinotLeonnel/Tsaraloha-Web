name: Deploy TSA Web to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  # Déclenché par le flux de publication des logiciels après une nouvelle Release.
  repository_dispatch:
    types: [ software-release ]
  # Nouvelles versions publiées dans Setup-Livrable : visibles sur le site au plus tard six heures après.
  schedule:
    - cron: '17 */6 * * *'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      # Versions publiées lues côté serveur ; --strict arrête le déploiement si GitHub ne répond pas,
      # plutôt que de publier des téléchargements non actualisés.
      - name: Fetch published releases
        run: node scripts/fetch-releases.mjs --strict
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build static site
        run: npm run build
        env:
          VITE_BASE_PATH: /Tsaraloha-Web/
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Documentation du moteur Fem3D : publiée par son propre dépôt (TSA-3D-FEM-Engine,
      # https://christinotleonnel.github.io/TSA-3D-FEM-Engine/). L'ancienne copie /fem3d/ (2026-10-19) est redirigée
      # vers ce site par public/fem3d/index.html et public/404.html.

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
